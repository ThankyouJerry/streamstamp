<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamStamp</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <main>
        <header class="hero">
            <div class="brand-mark">S</div>
            <div class="hero-copy">
                <strong>StreamStamp</strong>
                <span>YouTube의 중요한 순간을 기록하세요.</span>
            </div>
            <span class="version">v1.1</span>
        </header>

        <section class="summary" aria-label="저장 현황">
            <div><strong id="video-count">0</strong><span>저장한 영상</span></div>
            <div><strong id="timestamp-count">0</strong><span>타임스탬프</span></div>
        </section>

        <button id="record-btn" class="primary-button" type="button">현재 영상에 타임스탬프 추가</button>
        <p id="status" class="status" aria-live="polite"></p>

        <section class="library" aria-labelledby="library-title">
            <div class="section-title">
                <h1 id="library-title">내 타임스탬프</h1>
                <button id="backup-menu-btn" class="text-button" type="button" aria-expanded="false">백업</button>
            </div>
            <div id="backup-actions" class="backup-actions" hidden>
                <button id="export-backup-btn" type="button">JSON 내보내기</button>
                <button id="import-backup-btn" type="button">JSON 가져오기</button>
                <input id="import-file" type="file" accept="application/json,.json" hidden />
            </div>
            <label class="search-box" for="search-input">
                <span>⌕</span>
                <input id="search-input" type="search" placeholder="영상 제목 또는 메모 검색" autocomplete="off" />
            </label>
            <div class="video-list" id="video-list"></div>
        </section>

        <footer>데이터는 이 Chrome 프로필에만 저장됩니다.</footer>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
